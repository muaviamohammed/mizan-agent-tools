[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mizan-agent-tools"
version = "0.2.0"
description = "Verify MIZAN zero-knowledge track-record credentials from LangChain, LangGraph and CrewAI agents before trusting, paying, copying or allocating to a trading agent."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MIZAN", email = "muavia@mizan.market" }]
keywords = ["mizan", "zero-knowledge", "track-record", "verification", "langchain", "langgraph", "crewai", "agents", "trading", "stark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Security :: Cryptography",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.5,<3"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
langgraph = ["langchain-core>=0.3", "langgraph>=0.2"]
crewai = ["crewai>=0.100"]
test = ["pytest>=8", "respx>=0.21"]

[project.urls]
Homepage = "https://mizan.market/skill/"
Source = "https://github.com/muaviamohammed/mizan-agent-tools"
Registry = "https://mizan.market/registry/"
Standard = "https://mizan.market/standard-spec"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_agent_tools"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits the real MIZAN API (opt in with -m live)"]
